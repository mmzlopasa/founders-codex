name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the unsigned IPA to GitHub Releases for import into Feather"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA for Feather
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out game project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check for private asset repository access
        id: asset-access
        shell: bash
        env:
          ASSET_REPO_TOKEN: ${{ secrets.FOUNDERS_ASSET_REPO_TOKEN }}
        run: |
          if [[ -n "$ASSET_REPO_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Private Asset Store files are not configured; this run will use project fallback content."
          fi

      - name: Check out licensed Unity assets
        if: steps.asset-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: mmzlopasa/founders-codex-assets
          token: ${{ secrets.FOUNDERS_ASSET_REPO_TOKEN }}
          path: .private-assets
          lfs: true

      - name: Import licensed Unity assets into the project
        if: steps.asset-access.outputs.available == 'true'
        shell: bash
        run: |
          source_assets=".private-assets/Assets/StoreAssets"
          if [[ ! -d "$source_assets" ]]; then
            echo "Private asset repository must contain Assets/StoreAssets."
            exit 1
          fi
          mkdir -p Assets/StoreAssets
          rsync -a --exclude='.git' "$source_assets/" Assets/StoreAssets/

      - name: Check Unity credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
            echo "Add UNITY_LICENSE (Personal) or UNITY_SERIAL (Plus/Pro) to GitHub Actions secrets."
            exit 1
          fi
          if [[ -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "Add UNITY_EMAIL and UNITY_PASSWORD to GitHub Actions secrets."
            exit 1
          fi

      - name: Cache Unity imports
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-ios-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-library-ios-

      - name: Build iOS Xcode project with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          targetPlatform: iOS
          buildMethod: Founders.EditorTools.IOSBuildCommand.BuildPlayer

      - name: Build app without Apple code signing
        shell: bash
        run: |
          project="Build/iOS/Unity-iPhone.xcodeproj"
          derived_data="$RUNNER_TEMP/FoundersDerived"
          app_path="$derived_data/Build/Products/Release-iphoneos/Unity-iPhone.app"

          xcodebuild \
            -project "$project" \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            build

          if [[ ! -d "$app_path" ]]; then
            echo "Unsigned Unity-iPhone.app was not produced at $app_path"
            exit 1
          fi

          staging="$RUNNER_TEMP/FoundersIPA"
          destination="$GITHUB_WORKSPACE/Build/Release/Founders-The-Long-Rise-unsigned.ipa"
          mkdir -p "$staging/Payload" "$(dirname "$destination")"
          cp -R "$app_path" "$staging/Payload/Unity-iPhone.app"
          (cd "$staging" && /usr/bin/zip -qry "$destination" Payload)
          test -s "$destination"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: founders-the-long-rise-unsigned-ipa
          path: Build/Release/Founders-The-Long-Rise-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish unsigned IPA to GitHub Releases
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Founders The Long Rise v0.1.${{ github.run_number }} (unsigned)
          prerelease: true
          files: Build/Release/Founders-The-Long-Rise-unsigned.ipa

      - name: Upload Xcode project for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founders-ios-xcode-project
          path: Build/iOS
          if-no-files-found: ignore
          retention-days: 14
