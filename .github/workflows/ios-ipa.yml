name: Build signed iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Build and sign Feather IPA
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check required credentials
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Cache Unity imports
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-ios-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-library-ios-

      - name: Build iOS Xcode project with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          targetPlatform: iOS
          buildMethod: Founders.EditorTools.IOSBuildCommand.BuildPlayer

      - name: Install Apple signing certificate and profile
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/founders-distribution.p12"
          profile_path="$RUNNER_TEMP/founders-ad-hoc.mobileprovision"
          keychain_path="$RUNNER_TEMP/founders-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db

          security cms -D -i "$profile_path" > "$RUNNER_TEMP/founders-profile.plist"
          profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/founders-profile.plist")
          profile_name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/founders-profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Archive and export ad hoc IPA
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          project="Build/iOS/Unity-iPhone.xcodeproj"
          archive_path="$RUNNER_TEMP/Founders.xcarchive"
          export_path="$RUNNER_TEMP/FoundersExport"
          options_path="$RUNNER_TEMP/ExportOptions.plist"

          cat > "$options_path" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.mmzlopasa.founderslongrise</key><string>$PROFILE_NAME</string>
            </dict>
            <key>destination</key><string>export</string>
            <key>stripSwiftSymbols</key><true/>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -project "$project" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$options_path"

          mkdir -p Build/Release
          ipa_path="$(find "$export_path" -maxdepth 2 -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "Xcode did not produce an IPA."
            exit 1
          fi
          cp "$ipa_path" Build/Release/Founders-The-Long-Rise.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: founders-the-long-rise-ipa
          path: Build/Release/Founders-The-Long-Rise.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode project for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: founders-ios-xcode-project
          path: Build/iOS
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary signing identity
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/founders-distribution.p12"
          rm -f "$RUNNER_TEMP/founders-ad-hoc.mobileprovision"
          rm -f "$RUNNER_TEMP/founders-profile.plist"
