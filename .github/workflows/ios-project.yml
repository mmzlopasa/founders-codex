name: Export iOS Xcode project

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-ios:
    name: Generate the iOS Xcode project
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Cache Unity imports
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-library-ios-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-library-ios-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.3f1
          targetPlatform: iOS
          buildMethod: Founders.EditorTools.IOSBuildCommand.BuildPlayer

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: founders-ios-xcode-project
          path: Build/iOS
          if-no-files-found: error
          retention-days: 14
